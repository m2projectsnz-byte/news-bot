name: Bluesky News Bot

on:
  schedule:
    - cron: "0 */3 * * *"   # 3時間ごと（UTC基準）
  workflow_dispatch:         # 手動実行ボタン用

permissions:
  contents: write            # posted.json を保存するため

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Post news to Bluesky
        run: python bot.py
        env:
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}

      - name: Save posted list
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add posted.json
          git diff --cached --quiet || (git commit -m "update posted list" && git push)
